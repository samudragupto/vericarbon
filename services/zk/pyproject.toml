[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vericarbon-zk"
version = "0.1.0"
description = "VeriCarbon ZK workspace: ezkl Halo2 circuit compilation, proving, verification, and EVM verifier generation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ezkl==23.0.5",
    "numpy==2.4.6",
    "onnx==1.23.2",
    "onnxruntime==1.31.1",
    "typer==0.15.2",
]

[project.scripts]
zk = "vericarbon_zk.cli:app"

[dependency-groups]
dev = [
    "black==25.1.0",
    "pytest==8.3.5",
    "ruff==0.9.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vericarbon_zk"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

